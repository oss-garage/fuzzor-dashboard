name: Scrape and deploy

on:
  schedule:
    - cron: '0 * * * *'  # every hour
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      full_scrape:
        description: 'Scrape every campaign again instead of reusing completed ones from the last run'
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout master
        uses: actions/checkout@v4

      - name: Checkout last published data
        if: ${{ !inputs.full_scrape }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: previous

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Scrape data
        run: python scrape.py http://bitcoind-fuzz.dergoegge.de:8000/ -p bitcoin --previous previous

      - name: Prepare publish directory
        run: |
          mkdir -p publish
          cp data.json index.html publish/
          cp -r data publish/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
